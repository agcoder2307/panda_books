name: CI/CD (Docker Compose -> VM)

on:
  push:
    branches: ["master"]

jobs:
  compose-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check (package files exist)
        run: |
          ls -la
          test -f package.json
          test -f yarn.lock

      - name: Build & Run via docker compose (test)
        run: |
          docker compose -f docker-compose.yaml up -d --build
          docker compose -f docker-compose.yaml ps
          sleep 5
          curl -fsS http://127.0.0.1:5173/ | head -n 20
          docker compose -f docker-compose.yaml down

  deploy:
    needs: compose-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy project to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: "/opt/panda_books_frontend"

      - name: Deploy on VM via docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/panda_books_frontend
            docker compose -f docker-compose.yaml down || true
            docker compose -f docker-compose.yaml up -d --build
            docker compose -f docker-compose.yaml ps

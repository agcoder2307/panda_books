name: CI/CD (Docker Compose -> VM)

on:
  push:
    branches: [ "master" ]

jobs:
  compose-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & Run via docker compose (test)
        run: |
          docker compose -f docker-compose.yaml up -d --build
          docker ps
          sleep 5
          curl -fsS http://127.0.0.1:5175/ | head -n 5
          docker compose -f docker-compose.yaml down

  deploy:
    needs: compose-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy project to VM
        uses: appleboy/scp-action@v0.1.7SH_PRIVATE_KEY 
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: "/opt/panda_books_frontend"

      - name: Deploy on VM via docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/panda_books_frontend
            docker compose -f docker-compose.yaml up -d --build
            docker ps | grep panda_frontend || true

